<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Terminal Climber</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div
      id="app"
      data-climber-state="grounded"
      data-backend-status="initializing"
      data-hold-count="0"
      data-click-through="true"
    >
      <canvas
        id="climber-canvas"
        role="img"
        aria-label="Terminal Climber moving across visible terminal rows"
      >
        Terminal Climber animation.
      </canvas>

    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
